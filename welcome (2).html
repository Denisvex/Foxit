<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>foxit — welcome</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#000; }
  body { background:#000; color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100dvh; }
  .stage { text-align:center; width:min(92vw,380px); animation:in .7s ease-out both; }
  @keyframes in { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:none } }
  .bubble { background:#111; border:1px solid #222; border-radius:16px; padding:14px 16px; margin-bottom:14px; }
  .bubble b { color:#FF6B35; }
  .fox-wrap { width:min(68vw,280px); aspect-ratio:1/1; margin:0 auto; animation:wave 2.4s ease-in-out infinite; }
  @keyframes wave { 0%,100%{transform:rotate(0) translateY(0)} 50%{transform:rotate(-1.5deg) translateY(-6px)} }
  .fox { width:100%; height:100%; object-fit:contain; display:block; filter:drop-shadow(0 8px 32px rgba(255,107,53,.35)); }
  h1 { font-size:30px; margin-top:12px; letter-spacing:-.02em; }
  p.sub { color:#999; margin-top:6px; font-size:14px; }
  .start-wrap { margin-top:56px; display:flex; justify-content:center; }
  .start-btn { width:270px; height:62px; border-radius:999px; border:none; background:#FF6B35; color:#000; font-size:18px; font-weight:800; letter-spacing:.02em; cursor:pointer; box-shadow:0 8px 32px rgba(255,107,53,.4); display:flex; align-items:center; justify-content:center; gap:10px; }
  .start-btn:active { transform:scale(.95); }
  .back { display:block; margin-top:14px; color:#666; font-size:13px; text-decoration:none; }
</style>
</head>
<body>
  <div class="stage">
    <div class="bubble">Hey! I'm <b>Foxit</b> — let's run morning & afternoon, scroll less.</div>
    <div class="fox-wrap"><img class="fox" src="Foxit-welcome.png" alt="Foxit waving" /></div>
    <h1>Welcome</h1>
    <p class="sub">2 runs a day keeps the scroll away</p>
    <div class="start-wrap">
      <button class="start-btn" onclick="location.href='goal.html'">lets start <span aria-hidden="true">→</span></button>
    </div>
    <a class="back" href="index.html">↺ replay loading</a>
  </div>
</body>
</html>
