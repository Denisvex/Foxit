<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>foxit — workouts</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#08080a; }
  body { background:linear-gradient(180deg,#2a2a33 0%,#1e1e25 28%,#141419 58%,#0c0c10 82%,#08080a 100%); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:block; min-height:100dvh; padding:18px 0 28px; }
  .stage { text-align:center; width:min(92vw,380px); margin:0 auto; animation:in .7s ease-out both; }
  @keyframes in { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:none } }
  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .topbar a { color:#999; font-size:13px; font-weight:800; text-decoration:none; }
  .topbar b { font-size:17px; letter-spacing:-.02em; }
  .topbar b span { color:#FF6B35; }
  .bubble { background:#111; border:1px solid #222; border-radius:16px; padding:14px 16px; margin-bottom:14px; font-size:15px; }
  .bubble b { color:#FF6B35; }

  .fox-wrap { width:min(68vw,260px); aspect-ratio:1/1; margin:0 auto; animation:cool 3s ease-in-out infinite; }
  @keyframes cool { 0%,100%{transform:rotate(0) translateY(0)} 50%{transform:rotate(-2deg) translateY(-6px)} }
  .fox { width:100%; height:100%; object-fit:contain; display:block; filter:drop-shadow(0 8px 32px rgba(46,124,246,.45)); }
  .fox-alt { display:none; }
  h1 { font-size:28px; margin-top:12px; letter-spacing:-.02em; }
  p.sub { color:#999; margin-top:6px; font-size:14px; }
  .search-row { margin-top:14px; display:flex; align-items:center; background:#111; border:1px solid #222; border-radius:999px; padding:8px 16px; gap:8px; }
  .search-row input { flex:1; min-width:0; background:transparent; border:none; outline:none; color:#fff; font-size:14px; font-weight:600; font-family:inherit; }
  .search-row input::placeholder { color:#555; }
  .custom-row { margin-top:8px; display:flex; gap:8px; }
  .custom-row input { flex:1; min-width:0; background:#0a0a0a; border:1px solid #333; color:#fff; border-radius:12px; padding:10px 12px; font-size:14px; font-weight:600; font-family:inherit; }
  .custom-row input:focus { border-color:#2E7CF6; outline:none; }
  .custom-row select { flex:0 0 118px; background:#0a0a0a; border:1px solid #333; color:#fff; border-radius:12px; padding:10px 6px; font-size:13px; font-weight:700; font-family:inherit; }
  .custom-row select:focus { border-color:#2E7CF6; outline:none; }
  .custom-go { flex:0 0 52px; border-radius:12px; border:2px solid #B34A1F; border-bottom-width:4px; background:#2E7CF6; color:#fff; font-size:18px; font-weight:900; cursor:pointer; font-family:inherit; }
  .custom-go:active { transform:translateY(2px); border-bottom-width:2px; }
  .custom-hint { margin-top:6px; font-size:11px; color:#555; }
  #noHit { display:none; margin-top:10px; background:#111; border:1px dashed #444; border-radius:14px; padding:12px; font-size:13px; color:#999; }
  #noHit button { margin-top:8px; width:100%; border-radius:12px; border:2px solid #B34A1F; background:#2E7CF6; color:#fff; font-weight:900; font-size:14px; padding:10px 0; cursor:pointer; font-family:inherit; }
  .cards { margin-top:16px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .card { background:#111; border:2px solid #2a2a2e; border-bottom-width:4px; border-radius:14px; padding:10px 2px 8px; cursor:pointer; color:#fff; font-family:inherit; }
  .card .e img { width:46px; height:46px; object-fit:contain; display:block; margin:0 auto; filter:drop-shadow(0 4px 12px rgba(255,107,53,.3)); }
  .card small { display:block; margin-top:4px; font-size:10px; font-weight:800; color:#999; }
  .card:active { transform:translateY(2px); border-bottom-width:2px; }
  .go-wrap { margin-top:18px; }
  .go-btn { width:100%; height:60px; border-radius:18px; border:2px solid #FF6B35; background:linear-gradient(to bottom, #2E7CF6 0%, #7a5fc0 48%, #c06a4a 52%, #FF6B35 100%); color:#fff; font-size:18px; font-weight:900; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; text-shadow:0 1px 4px rgba(0,0,0,.4); }
  .go-btn:active { transform:translateY(2px); }
</style>
</head>
<body>
  <div class="stage">
    <div class="topbar">
      <a href="dashboard.html">← dashboard</a>
      <b>fox<span>it</span></b>
      <span style="width:74px"></span>
    </div>
    <div class="bubble" id="bubble">Yo! I'm <b>Foxit Cool</b> — let's train!</div>

    <div class="fox-wrap">
      <div class="fox-alt" id="foxAlt"><img src="foxit-logo.png" alt="Foxit" style="width:110px;height:110px;object-fit:contain;" /></div>
      <img class="fox" id="foxCool" src="foxit-cool.png" alt="Foxit Cool welcoming you" />
    </div>
    <h1>Workouts</h1>
    <p class="sub">Pick your posture — scroll less, move more</p>
    <div class="search-row">⌕<input id="q" type="text" autocomplete="off" placeholder="Muscle or move: legs, jumping jacks…" /></div>
    <div class="custom-row">
      <input id="customName" type="text" maxlength="24" autocomplete="off" placeholder="Or type ANY workout: neck, calves…" />
      <select id="customMotion" aria-label="tracking motion">
        <option value="legs">Squats</option>
        <option value="back">Rows</option>
        <option value="abs">Knee raises</option>
        <option value="arms">Curls</option>
        <option value="shoulders">Press</option>
        <option value="cardio">Jacks</option>
        <option value="chest">Wall push</option>
        <option value="glutes">Kickbacks</option>
        <option value="fullbody">Squat press</option>
      </select>
      <button class="custom-go" id="customGo" aria-label="start custom workout">→</button>
    </div>
    <div class="custom-hint">Preset buttons are just suggestions — name anything, pick how it's tracked, train.</div>
    <div id="noHit"><span id="noHitText"></span><button id="noHitGo">Train it anyway →</button></div>
    <div class="cards" id="cards">
      <button class="card" data-p="legs" data-ex="squats"><div class="e"><img src="foxit-running.png" alt="Legs" loading="lazy" /></div><small>Legs</small></button>
      <button class="card" data-p="back" data-ex="standing rows"><div class="e"><img src="foxit-thinking.png" alt="Back" loading="lazy" /></div><small>Back</small></button>
      <button class="card" data-p="abs" data-ex="knee raises"><div class="e"><img src="foxit-dashboard.png" alt="Abdomen" loading="lazy" /></div><small>Abdomen</small></button>
      <button class="card" data-p="arms" data-ex="arm curls"><div class="e"><img src="foxit-alarmtime.png" alt="Arms" loading="lazy" /></div><small>Arms</small></button>
      <button class="card" data-p="shoulders" data-ex="overhead press"><div class="e"><img src="foxit-asking.png" alt="Shoulders" loading="lazy" /></div><small>Shoulders</small></button>
      <button class="card" data-p="cardio" data-ex="jumping jacks"><div class="e"><img src="Foxit-loadingpage.png" alt="Cardio" loading="lazy" /></div><small>Cardio</small></button>
      <button class="card" data-p="chest" data-ex="wall push"><div class="e"><img src="Foxit-welcome.png" alt="Chest" loading="lazy" /></div><small>Chest</small></button>
      <button class="card" data-p="glutes" data-ex="standing kickbacks"><div class="e"><img src="foxit-glutes.png" alt="Glutes" loading="lazy" /></div><small>Glutes</small></button>
      <button class="card" data-p="fullbody" data-ex="squat press"><div class="e"><img src="foxit-fullbody.png" alt="Full body" loading="lazy" /></div><small>Full body</small></button>
      <button class="card" data-p="face" data-ex="jaw opens face yoga"><div class="e"><img src="foxit-cool.png" alt="Face" loading="lazy" /></div><small>Face</small></button>
      <button class="card" data-p="neck" data-ex="head nods neck rolls"><div class="e"><img src="foxit-coach.png" alt="Neck" loading="lazy" /></div><small>Neck</small></button>
    </div>
    <div class="go-wrap">
      <button class="go-btn" id="goBtn">start workout <span aria-hidden="true">→</span></button>
    </div>
  </div>
  <div class="toast" id="toast" style="position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#FF6B35;color:#000;font-weight:900;font-size:14px;border-radius:14px;padding:12px 20px;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;"></div>
<script>
  const $=id=>document.getElementById(id);
  function toast(m){ const t=$('toast'); t.textContent=m; t.style.opacity=1; clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity=0,2200); }
  let name='champ';
  try{ name=localStorage.getItem('foxit_username')||'champ'; }catch(e){}
  $('bubble').innerHTML=`Yo! I'm <b>Foxit Cool</b> — let's train, <b>${name}</b>!`;
  const img=$('foxCool');
  img.addEventListener('error',()=>{ img.style.display='none'; $('foxAlt').style.display='block'; });
  if(img.complete&&img.naturalWidth===0){ img.style.display='none'; $('foxAlt').style.display='block'; }
  const GROUPS=['legs','back','abs','arms','shoulders','cardio','chest','glutes','fullbody','face','neck'];
  try{
    GROUPS.forEach(g=>{
      if(localStorage.getItem('foxit_done_'+g)){
        const c=document.querySelector(`#cards .card[data-p="${g}"]`);
        if(c){ c.style.borderColor='#2E7CF6'; c.querySelector('small').innerHTML+=' ✓'; }
      }
    });
  }catch(e){}
  document.querySelectorAll('#cards .card').forEach(c=>c.addEventListener('click',()=>location.href='verify.html?group='+c.dataset.p));
  function customURL(name){
    return 'verify.html?custom='+encodeURIComponent(name)+'&motion='+$('customMotion').value;
  }
  // Only real words make it through — "yes" is not a workout
  const JUNK=new Set(['yes','no','nope','ok','okay','yo','hi','hey','lol','idk','test','asdf','qwer',
    'abc','aaa','xxx','blah','maybe','nothing','whatever','qwerty','hello','the','and','this','that',
    'what','when','why','who','how','are','you','i','a','an','it','is','be','do','so','xd','hehe','haha',
    'foxit','cool','stuff','something','random','free','style','none','nah','yep','yup','nahh','pro']);
  function looksLikeWorkout(raw){
    const w=raw.toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,' ').trim();
    if(w.replace(/[\s-]/g,'').length<3) return false;          // too short: "hi", "8"
    const letters=(w.match(/[a-z]/g)||[]).length;
    if(letters<2) return false;                                // needs an actual word
    const words=w.split(' ').filter(Boolean);
    if(words.length&&words.every(x=>JUNK.has(x))) return false; // "yes yes" still isn't a workout
    if(JUNK.has(w)) return false;
    if(/^(.)\1+$/.test(w.replace(/[\s-]/g,''))) return false;  // "aaaa", "hhh"
    const core=w.replace(/\s/g,'');
    if((core.match(/[a-z0-9]/g)||[]).length/core.length<0.7) return false;  // symbol soup
    if(/^\d+$/.test(core)) return false;                       // "8"
    return w;
  }
  $('customGo').addEventListener('click',()=>{
    const raw=$('customName').value.slice(0,24);
    const v=looksLikeWorkout(raw);
    if(!v){ toast('Name a real workout — like “calf raises” or “neck rolls”'); return; }
    location.href=customURL(v);
  });
  $('customName').addEventListener('keydown',e=>{ if(e.key==='Enter') $('customGo').click(); });
  $('noHitGo').addEventListener('click',()=>{
    const raw=$('q').value.trim().slice(0,24);
    const v=looksLikeWorkout(raw);
    if(raw&&!v){ toast('Name a real workout — like “calf raises” or “neck rolls”'); return; }
    location.href=customURL(v||'Freestyle');
  });
  $('q').addEventListener('input',()=>{
    const v=$('q').value.trim().toLowerCase();
    let shown=0;
    document.querySelectorAll('#cards .card').forEach(c=>{
      const hay=(c.dataset.p+' '+(c.dataset.ex||'')+' '+c.querySelector('small').textContent).toLowerCase();
      const hit=(!v||hay.includes(v));
      c.style.display=hit?'':'none';
      if(hit) shown++;
    });
    $('noHit').style.display=(v&&!shown)?'block':'none';
    if(v&&!shown) $('noHitText').textContent=`No preset for "${$('q').value.trim()}" — train it your way:`;
  });
  $('goBtn').addEventListener('click',()=>{
    let next='legs';
    try{ next=GROUPS.find(g=>!localStorage.getItem('foxit_done_'+g))||'legs'; }catch(e){}
    location.href='verify.html?group='+next;
  });
</script>


<script>
(function(){
  var b=document.querySelector('#bubble,.bubble');
  if(!b||!('speechSynthesis' in window)) return;
  var M={speaker1:{pitch:0.85,rate:1.0,male:true},
         simple:  {pitch:1.1, rate:0.7,male:true},
         classic: {pitch:1.0, rate:1.0,male:false}};
  var id='speaker1';
  try{ id=localStorage.getItem('foxit_voice_model')||'speaker1'; }catch(e){}
  // Foxit only greets on his own model: speaker 1.0 must be active
  if(id!=='speaker1') return;
  var m=M[id]||M.speaker1;
  function voice(){
    var vs=speechSynthesis.getVoices();
    var en=vs.filter(function(v){return /^en/i.test(v.lang);});
    if(!en.length) return vs[0]||null;
    if(m.male) return en.find(function(v){return /male|david|daniel|alex|fred/i.test(v.name);})||en[0];
    return en[0];
  }
  try{ speechSynthesis.getVoices(); }catch(e){}
  function say(){
    try{
      if(speechSynthesis.speaking) speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(b.textContent.trim());
      var v=voice(); if(v) u.voice=v;
      u.pitch=m.pitch; u.rate=m.rate;
      speechSynthesis.speak(u);
    }catch(e){}
  }
  var done=false;
  function auto(){ if(done) return; done=true; setTimeout(say,400); }
  try{
    if('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged=auto;
    setTimeout(auto,1500);
  }catch(e){}
  addEventListener('pagehide',function(){ try{ speechSynthesis.cancel(); }catch(e){} });
})();
</script>
<style id="helperStyle">
  .helper-hint { position:absolute; left:50%; top:100%; transform:translateX(-50%); margin-top:3px;
    font-size:9px; font-weight:800; letter-spacing:.03em; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#c9c9d4; background:rgba(8,8,10,.94); border:1px solid #33343c; border-radius:8px;
    padding:2px 6px; white-space:nowrap; pointer-events:none; z-index:700; line-height:1.35; text-transform:lowercase; }
</style>

<script id="helperPatch">
(function(){
  var H={ runBtn:'start a run', workoutsBtn:'open workouts', modelsBtn:'open models & voices',
    spotsBtn:'show your spots', mapToggle:'map controls', gpsBtn:'jump to my location',
    zoomIn:'zoom in', zoomOut:'zoom out', addBtn:'save a new spot', startPointBtn:'set run start',
    searchBtn:'search places', searchClose:'close search', spotCancel:'cancel', spotSave:'save spot',
    profileClose:'close profile', settingsBtn:'open settings',
    settingsClose:'close settings', nameSave:'save name', setNameSave:'save name', goalSave:'save goal',
    menuBtn:'open menu', startBtn:'begin live check', stopBtn:'end session', repMinus:'fewer reps',
    repPlus:'more reps', customGo:'start custom workout', noHitGo:'train it anyway',
    goBtn:'start workout', minus:'one less', plus:'one more', continue:'continue to next step',
    spkPlay:'play the voice', spkStop:'stop the voice' };
  function active(){ try{ return (localStorage.getItem('foxit_voice_model')||'')==='helper1'; }catch(e){ return false; } }
  function hintFor(b){
    if(b.dataset && b.dataset.hint) return b.dataset.hint;
    if(b.id && H[b.id]) return H[b.id];
    if(b.classList && b.classList.contains('card') && b.dataset.p) return 'train '+b.dataset.p;
    if(b.dataset && b.dataset.v) return 'set to '+b.dataset.v;
    if(b.dataset && b.dataset.src) return 'open this page';
    if(b.tagName==='A'){
      var h=(b.getAttribute('href')||'').replace('.html','');
      if(h==='dashboard') return 'back to dashboard';
      if(h==='workouts') return 'back to workouts';
      if(h==='models') return 'back to models';
      if(b.classList.contains('back')) return 'go back a step';
      if(h && h!=='#') return 'go to '+h;
      return '';
    }
    var t=(b.textContent||'').trim().toLowerCase();
    if(t==='continue') return 'continue to next step';
    if(t.indexOf('train it anyway')===0) return 'train it your way';
    return '';
  }
  function clear(){
    var old=document.querySelectorAll('.helper-hint');
    for(var i=0;i<old.length;i++) old[i].parentNode.removeChild(old[i]);
  }
  window.applyHelperHints=function(){
    clear();
    if(!active()) return;
    var els=document.querySelectorAll('button, a[href]');
    for(var i=0;i<els.length;i++){
      (function(b){
        if(b.querySelector('.helper-hint')) return;
        var h=hintFor(b); if(!h) return;
        var s=document.createElement('small');
        s.className='helper-hint'; s.textContent=h;
        var cs=getComputedStyle(b);
        if(cs.position==='static') b.style.position='relative';
        b.appendChild(s);
        var r=b.getBoundingClientRect();
        if(r.bottom>window.innerHeight-26){ s.style.top='auto'; s.style.bottom='100%'; s.style.marginTop='0'; s.style.marginBottom='3px'; }
        if(r.left<64){ s.style.left='0'; s.style.transform='none'; }
        if(r.right>window.innerWidth-64){ s.style.left='auto'; s.style.right='0'; s.style.transform='none'; }
      })(els[i]);
    }
  };
  function boot(){ try{ window.applyHelperHints(); }catch(e){} }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
