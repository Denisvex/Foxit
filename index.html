<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>foxit — loading</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#000; }
  body {
    background:linear-gradient(180deg,#2a2a33 0%,#1e1e25 28%,#141419 58%,#0c0c10 82%,#08080a 100%); color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh; overflow:hidden;
  }
  .stage { text-align:center; width:min(92vw,380px); animation:stageIn .8s ease-out both; }
  @keyframes stageIn { from { opacity:0; transform:scale(.92) } to { opacity:1; transform:scale(1) } }
  .fox-wrap { width:min(72vw,300px); aspect-ratio:1/1; margin:0 auto 10px; animation:breathe 2.2s ease-in-out .8s infinite; }
  @keyframes breathe { 0%,100%{transform:scale(1) translateY(0)} 50%{transform:scale(1.04) translateY(-6px)} }
  .fox { width:100%; height:100%; object-fit:contain; display:block; filter:drop-shadow(0 8px 32px rgba(255,107,53,.35)); }
  h1 { font-size:46px; font-weight:800; letter-spacing:-.04em; }
  h1 span { color:#FF6B35; }
  p { margin-top:8px; font-size:13px; color:#999; letter-spacing:.16em; text-transform:uppercase; }
  .bar { margin:24px auto 0; width:200px; height:4px; border-radius:99px; background:#1a1a1a; overflow:hidden; }
  .bar i { display:block; height:100%; width:40%; border-radius:99px; background:#FF6B35; animation:load 1.4s ease-in-out infinite; }
  @keyframes load { 0%{transform:translateX(-100%)} 100%{transform:translateX(500%)} }
</style>
</head>
<body>
  <div class="stage">
    <div class="fox-wrap">
      <img class="fox" src="Foxit-loadingpage.png" alt="Foxit fox mascot" />
    </div>
    <h1>fox<span>it</span></h1>
    <p>walk more · scroll less</p>
    <div class="bar"><i></i></div>
  </div>
<script>
  setTimeout(() => location.href = 'welcome.html', 2400);
  addEventListener('click', () => location.href = 'welcome.html');
</script>
<style id="helperStyle">
  .helper-hint { position:absolute; left:50%; top:100%; transform:translateX(-50%); margin-top:3px;
    font-size:9px; font-weight:800; letter-spacing:.03em; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#c9c9d4; background:rgba(8,8,10,.94); border:1px solid #33343c; border-radius:8px;
    padding:2px 6px; white-space:nowrap; pointer-events:none; z-index:700; line-height:1.35; text-transform:lowercase; }
</style>

<script id="helperPatch">
(function(){
  var H={ runBtn:'start a run', workoutsBtn:'open workouts', modelsBtn:'open models & voices',
    spotsBtn:'show your spots', mapToggle:'map controls', gpsBtn:'jump to my location',
    zoomIn:'zoom in', zoomOut:'zoom out', addBtn:'save a new spot', startPointBtn:'set run start',
    searchBtn:'search places', searchClose:'close search', spotCancel:'cancel', spotSave:'save spot',
    profileClose:'close profile', settingsBtn:'open settings',
    settingsClose:'close settings', nameSave:'save name', setNameSave:'save name', goalSave:'save goal',
    menuBtn:'open menu', startBtn:'begin live check', stopBtn:'end session', repMinus:'fewer reps',
    repPlus:'more reps', customGo:'start custom workout', noHitGo:'train it anyway',
    goBtn:'start workout', minus:'one less', plus:'one more', continue:'continue to next step',
    spkPlay:'play the voice', spkStop:'stop the voice' };
  function active(){ try{ return (localStorage.getItem('foxit_voice_model')||'')==='helper1'; }catch(e){ return false; } }
  function hintFor(b){
    if(b.dataset && b.dataset.hint) return b.dataset.hint;
    if(b.id && H[b.id]) return H[b.id];
    if(b.classList && b.classList.contains('card') && b.dataset.p) return 'train '+b.dataset.p;
    if(b.dataset && b.dataset.v) return 'set to '+b.dataset.v;
    if(b.dataset && b.dataset.src) return 'open this page';
    if(b.tagName==='A'){
      var h=(b.getAttribute('href')||'').replace('.html','');
      if(h==='dashboard') return 'back to dashboard';
      if(h==='workouts') return 'back to workouts';
      if(h==='models') return 'back to models';
      if(b.classList.contains('back')) return 'go back a step';
      if(h && h!=='#') return 'go to '+h;
      return '';
    }
    var t=(b.textContent||'').trim().toLowerCase();
    if(t==='continue') return 'continue to next step';
    if(t.indexOf('train it anyway')===0) return 'train it your way';
    return '';
  }
  function clear(){
    var old=document.querySelectorAll('.helper-hint');
    for(var i=0;i<old.length;i++) old[i].parentNode.removeChild(old[i]);
  }
  window.applyHelperHints=function(){
    clear();
    if(!active()) return;
    var els=document.querySelectorAll('button, a[href]');
    for(var i=0;i<els.length;i++){
      (function(b){
        if(b.querySelector('.helper-hint')) return;
        var h=hintFor(b); if(!h) return;
        var s=document.createElement('small');
        s.className='helper-hint'; s.textContent=h;
        var cs=getComputedStyle(b);
        if(cs.position==='static') b.style.position='relative';
        b.appendChild(s);
        var r=b.getBoundingClientRect();
        if(r.bottom>window.innerHeight-26){ s.style.top='auto'; s.style.bottom='100%'; s.style.marginTop='0'; s.style.marginBottom='3px'; }
        if(r.left<64){ s.style.left='0'; s.style.transform='none'; }
        if(r.right>window.innerWidth-64){ s.style.left='auto'; s.style.right='0'; s.style.transform='none'; }
      })(els[i]);
    }
  };
  function boot(){ try{ window.applyHelperHints(); }catch(e){} }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style id="softFont">
  body { font-family:'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif !important;
    color:#fff !important;
    text-shadow:none !important; }
  * { color:#fff !important; text-shadow:none !important; }
  h1, h2, .topbar b, .brand, .brand b, .hero-text h2, #done b, .m-head .t b, .model .t b {
    font-family:'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-weight:600 !important;
    color:#fff !important;
    text-shadow:none !important; }
  h1 span, h2 span, .topbar b span, .brand b span, .hero-text h2 span { color:#fff !important; }
  input::placeholder, textarea::placeholder { color:#6b6b75 !important; text-shadow:none !important; }
  .custom-hint, #noHit, .search-hint, .note, .desc, .privacy, .soon, .map-fallback,
  #idle p, .sub, .helper-hint, .chat-hint, .hint, .field small, .fld-note, .sheet-note {
    color:#8b8b96 !important; text-shadow:none !important; }
  /* dark type stays dark on bright buttons/tiles — white on orange is unreadable */
  .start-btn, #spotsBtn, #goalSave, #setNameSave, #nameSave, .toast, .sheet-close, .btn-primary,
  .chip.on, .chip.on .x, .chip:active, .mini-chip.on, .map-toggle.on, .map-btns button.armed,
  .map-btns button:active, .screen-tabs button.on, .spot-form .row button.save,
  .stepper button:active, .day.hit b, .day.today b, .fp-pin.sel, .checks li i,
  .ampm-col button.on {
    color:#000 !important; }
</style>
</body>
</html>
